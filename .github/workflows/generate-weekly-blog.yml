name: Generate weekly blog post

on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * 1"

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: scheduled-content-publication
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: pre

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Generate article with Gemini
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          VERTEX_AI_LOCATION: us-central1
          VERTEX_AI_MODEL: gemini-2.5-flash
        run: node scripts/generate-blog-post.mjs

      - name: Publish content update to pre
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/content.es.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "content: generate weekly blog post"
          git push origin HEAD:pre
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run CI and publish to production
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref pre
