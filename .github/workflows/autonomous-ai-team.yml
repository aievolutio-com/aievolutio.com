name: Autonomous AI Team

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"

permissions:
  actions: write
  contents: write
  id-token: write
  issues: write

concurrency:
  group: autonomous-ai-daily-cycle
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current production source
        uses: actions/checkout@v4
        with:
          ref: pre
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Run the autonomous AI team
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          VERTEX_AI_LOCATION: us-central1
          VERTEX_AI_MODEL: gemini-2.5-flash
          VERTEX_AI_IMAGE_MODEL: imagen-4.0-generate-001
        run: node scripts/autonomous-ai-team.mjs

  notify-failure:
    if: ${{ failure() }}
    needs: evolve
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Notify the site owner
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = `[AI Team] Autonomous publication failed (${new Date().toISOString().slice(0, 10)})`;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            if (existing.some(issue => issue.title === title)) {
              core.info(`An open notification already exists: ${title}`);
              return;
            }
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body: `@luisromeroperez-com El ciclo diario falló. Comprueba en producción si Pages llegó a actualizarse antes de reintentar: el despliegue y la promoción de la rama son fases separadas. Si el artículo de hoy ya aparece, no generes otro.\n\n[Consultar ejecución y logs](${runUrl})`,
            });
