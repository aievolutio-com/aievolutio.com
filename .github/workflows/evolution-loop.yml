name: AIEvolutio Autonomous Evolution & Deploy

on:
  schedule:
    - cron: '0 * * * *' # Revisión y jardinería técnica cada hora (contenido: 1 vez al día a las 06:00 UTC)
  push:
    branches: [ main ]  # Despliegue en cada avance a main
  workflow_dispatch:    # Disparador manual para evolución bajo demanda

permissions:
  contents: write
  issues: write

concurrency:
  group: "pages-and-evolution"
  cancel-in-progress: false

jobs:
  evolve-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del Repositorio
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Ejecutar Ciclo Evolutivo IA (Sólo en Cron o Manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
        run: node scripts/autonomous-evolution.mjs

      - name: 4. Guardián de Calidad Autoreparable (No bloqueante)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          npx --yes prettier --write "**/*.{html,css,js,json,md}" || true
          node scripts/self-heal-check.mjs

      - name: 5. Auto-Commit Directo a Main (Cero Aprobación Humana)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "AIEvolutio-Engine"
          git config user.email "autonomous@aievolutio.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "evo(spiral): actualización autónoma de jardinería y mejora técnica"
            git fetch origin main
            git rebase -X theirs origin/main || (git rebase --abort && git merge --strategy-option=theirs origin/main -m "evo(merge): reconciliación automática")
            git push origin HEAD:main || true
          fi

      - name: 6. Emitir o Actualizar Parte de Observabilidad (Issue Único Diario)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "docs/daily-digest.md" ]; then
            TODAY=$(date -u +'%Y-%m-%d')
            ISSUE_TITLE="📊 Informe Evolutivo AIEvolutio — $TODAY"
            # Buscar si ya existe el issue de hoy para actualizarlo en lugar de spamear issues nuevos cada hora
            EXISTING_ISSUE=$(gh issue list --search "$ISSUE_TITLE in:title" --state open --json number --jq '.[0].number' || echo "")
            if [ -n "$EXISTING_ISSUE" ]; then
              gh issue comment "$EXISTING_ISSUE" --body-file "docs/daily-digest.md" || true
            else
              gh issue create --title "$ISSUE_TITLE" --body-file "docs/daily-digest.md" || true
            fi
            # Cerrar automáticamente issues obsoletos de fallos anteriores al Gran Reseteo
            for OLD_ID in $(gh issue list --search "[AI Team] in:title" --state open --json number --jq '.[].number' || echo ""); do
              gh issue close "$OLD_ID" --comment "Resuelto automáticamente tras la Iteración 0 (El Gran Reseteo)." || true
            done
            for OLD_ID in $(gh issue list --search "[Website] in:title" --state open --json number --jq '.[].number' || echo ""); do
              gh issue close "$OLD_ID" --comment "Resuelto automáticamente tras la Iteración 0 (El Gran Reseteo)." || true
            done
            for OLD_ID in $(gh issue list --search "[Site review] in:title" --state open --json number --jq '.[].number' || echo ""); do
              gh issue close "$OLD_ID" --comment "Resuelto automáticamente tras la Iteración 0 (El Gran Reseteo)." || true
            done
          fi

      - name: 7. Compilar Sitio Estático (dist/)
        run: |
          npm run build:site
          echo > dist/.nojekyll

      - name: 8. Desplegar a GitHub Pages (Rama gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          exclude_assets: '.github,docs,*.md,*.yml,*.yaml'
          force_orphan: true
