name: AIEvolutio Autonomous Evolution & Deploy

on:
  schedule:
    - cron: "23 5 * * *" # Ciclo evolutivo diario (05:23 UTC, fuera del minuto 00 para evitar cola de GitHub Actions)
  push:
    branches: [main] # Despliegue en cada avance a main
  workflow_dispatch: # Disparador manual para forzar ciclos de contenido o técnicos bajo demanda
    inputs:
      mode:
        description: "Modo de ciclo a forzar (auto, force-content, force-tech, audit-only)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - force-content
          - force-tech
          - audit-only
      author:
        description: "Perfil organizativo para firmar contenido (opcional: AIVisio, AIDux, AIJuris)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: "pages-and-evolution"
  cancel-in-progress: false

jobs:
  evolve-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del Repositorio
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Autenticar en Google Cloud con Workload Identity Federation
        id: google-auth
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          project_id: prj-aievolution-com
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          create_credentials_file: false

      - name: 3A. Fase 1 — Investigación de Frontera, EmoInsight y Avance Técnico del Roadmap (Commit 1)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'force-content')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_AUTHOR: ${{ inputs.author }}
        run: |
          git config user.name "AIEvolutio-Engine"
          git config user.email "autonomous@aievolutio.com"
          if [ "$INPUT_MODE" = "audit-only" ]; then
            node scripts/autonomous-evolution.mjs --audit-only
          else
            node scripts/autonomous-evolution.mjs --phase=tech
            npx --yes prettier --write "**/*.{html,css,js,json,md}" || true
            node scripts/self-heal-check.mjs
            git add -A
            if ! git diff --staged --quiet; then
              git commit -m "feat(roadmap-tech): avance autónomo del roadmap, investigación de frontera y sincronización EmoInsight"
            else
              echo "Fase 1 sin cambios pendientes en el árbol de trabajo."
            fi
          fi

      - name: 3B. Fase 2 — Publicación Editorial Guiada por EmoInsight y Frontera (Commit 2)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'force-tech' && inputs.mode != 'audit-only')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_AUTHOR: ${{ inputs.author }}
        run: |
          git config user.name "AIEvolutio-Engine"
          git config user.email "autonomous@aievolutio.com"
          ARGS="--phase=content"
          if [ "$INPUT_MODE" = "force-content" ]; then ARGS="$ARGS --force-content"; fi
          if [ -n "$INPUT_AUTHOR" ]; then ARGS="$ARGS --author=$INPUT_AUTHOR"; fi
          node scripts/autonomous-evolution.mjs $ARGS
          npx --yes prettier --write "**/*.{html,css,js,json,md}" || true
          node scripts/self-heal-check.mjs
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "feat(editorial): publicación autónoma diaria y parte de bitácora verificados"
          else
            echo "Fase 2 sin cambios pendientes en el árbol de trabajo."
          fi

      - name: 4. Autorreparación Final de Integridad y Antiduplicados
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'audit-only')
        run: |
          node scripts/self-heal-check.mjs

      - name: 5. Sincronizar y Subir Commits Autónomos a Main
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'audit-only')
        run: |
          git fetch origin main
          git rebase -X theirs origin/main || (git rebase --abort && git merge --strategy-option=theirs origin/main -m "evo(merge): reconciliación automática")
          git push origin HEAD:main || true

      - name: 6. Emitir o Actualizar Parte de Observabilidad (Issue Único Diario)
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'audit-only'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "docs/daily-digest.md" ]; then
            TODAY=$(date -u +'%Y-%m-%d')
            ISSUE_TITLE="📊 Informe Evolutivo AIEvolutio — $TODAY"
            EXISTING_ISSUE=$(gh issue list --search "$ISSUE_TITLE in:title" --state open --json number --jq '.[0].number' || echo "")
            if [ -n "$EXISTING_ISSUE" ]; then
              gh issue comment "$EXISTING_ISSUE" --body-file "docs/daily-digest.md" || true
            else
              gh issue create --title "$ISSUE_TITLE" --body-file "docs/daily-digest.md" || true
            fi
          fi

      - name: 7. Compilar Sitio Estático (dist/)
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'audit-only'
        run: |
          npm run build:site
          echo > dist/.nojekyll

      - name: 8. Desplegar a GitHub Pages (Rama gh-pages)
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'audit-only'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          exclude_assets: ".github,docs,*.md,*.yml,*.yaml"
          force_orphan: true
