name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ pre, main ]
  push:
    branches: [ pre ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: npm ci || npm i --no-fund --no-audit

      - name: Filename policy
        run: bash scripts/validate-filenames.sh

      - name: Lint JS
        run: npm run lint:js

      - name: Test content automation
        run: node --test scripts/*.test.mjs

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint HTML
        run: npm run lint:html

      - name: Validate HTML links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --verbose .

      - name: Start static server for pa11y (8081)
        run: |
          nohup npx http-server -c-1 . -p 8081 > /dev/null 2>&1 &
          echo $! > server.pid
          sleep 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install html5validator
        run: pip install --upgrade pip html5validator

      - name: Validate HTML
        run: html5validator --root . --blacklist node_modules --ignore-re node_modules

      - name: Accessibility (pa11y-ci)
        run: npm run a11y

      - name: Lighthouse CI (thresholds)
        run: npm run lhci:ci

      - name: Stop static server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
            rm -f server.pid
          fi

  deploy-pre:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/pre') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/pre') }}
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Add .nojekyll
        run: echo > .nojekyll

      - name: Deploy validated pre to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: |
            .github,docs,*.md,*.yml,*.yaml
          force_orphan: true

  publish-ai-evolution:
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/ai/daily-evolution/') }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout the validated candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Add .nojekyll
        run: echo > .nojekyll

      - name: Deploy validated candidate to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: |
            .github,docs,*.md,*.yml,*.yaml
          force_orphan: true

      - name: Promote deployed candidate to pre
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/pre',
            });
            if (branch.data.object.sha === context.sha) {
              core.info('The validated candidate is already promoted to pre.');
              return;
            }
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/pre',
              sha: context.sha,
              force: false,
            });

  notify-publication-failure:
    if: ${{ failure() && (github.ref == 'refs/heads/pre' || startsWith(github.ref, 'refs/heads/ai/daily-evolution/')) }}
    needs: [check, deploy-pre, publish-ai-evolution]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Notify the site owner
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const date = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Europe/Madrid',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
            }).format(new Date());
            const title = `[Website] CI or deployment failed (${date})`;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            if (existing.some(issue => issue.title === title)) {
              core.info(`An open notification already exists: ${title}`);
              return;
            }
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body: `@luisromeroperez-com La validación o alguna fase de publicación de \`${context.ref}\` ha fallado. Comprueba el job de Pages y el contenido servido antes de concluir si producción cambió o reintentar.\n\n[Consultar ejecución y logs](${runUrl})`,
            });
