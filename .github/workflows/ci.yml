name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ pre, main ]
  push:
    branches: [ pre ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: npm ci || npm i --no-fund --no-audit

      - name: Filename policy
        run: bash scripts/validate-filenames.sh

      - name: Lint JS
        run: npm run lint:js

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint HTML
        run: npm run lint:html

      - name: Validate HTML links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --verbose .

      - name: Start static server for pa11y (8081)
        run: |
          nohup npx http-server -c-1 . -p 8081 > /dev/null 2>&1 &
          echo $! > server.pid
          sleep 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install html5validator
        run: pip install --upgrade pip html5validator

      - name: Validate HTML
        run: html5validator --root . --blacklist node_modules --ignore-re node_modules

      - name: Accessibility (pa11y-ci)
        run: npm run a11y

      - name: Lighthouse CI (thresholds)
        run: npm run lhci:ci

      - name: Stop static server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
            rm -f server.pid
          fi

  deploy-scheduled-content:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/pre' }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Add .nojekyll
        run: echo > .nojekyll

      - name: Deploy validated content to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: |
            .github,docs,*.md,*.yml,*.yaml
          force_orphan: true

  publish-ai-evolution:
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/ai/daily-evolution/') }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: scheduled-content-publication
      cancel-in-progress: false
    steps:
      - name: Checkout the validated candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Add .nojekyll
        run: echo > .nojekyll

      - name: Deploy validated candidate to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: |
            .github,docs,*.md,*.yml,*.yaml
          force_orphan: true

      - name: Promote deployed candidate to pre
        run: git push origin "${GITHUB_SHA}:refs/heads/pre"
