name: Sync content from Sheets

on:
  workflow_dispatch:
    inputs:
      repair_attempt:
        description: Internal retry counter; leave at 1 for a normal run
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
  push:
    paths:
      - "content/sync.example.csv"
      - "scripts/sync-content.mjs"

permissions:
  actions: write
  contents: write

concurrency:
  group: scheduled-content-publication
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SHEET_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vTXUzpg8G45BF6TaUA-RGGVn1jl4mBlf2GFg1pq6wgJq-5WhOAZ9ZflFgsKc0RuNCCZlOYrVPAL6J5D/pub?output=csv
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Corregido de @v7 a @v4
        with:
          ref: pre

      - name: Setup Node
        uses: actions/setup-node@v4 # Asegurando @v4 oficial
        with:
          node-version: "22"

      - name: Sync content
        run: node scripts/sync-content.mjs

      - name: Publish content update to pre
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/content.es.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: sync content from sheets"
          git push origin HEAD:pre
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run CI and publish to production
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref pre

  repair:
    needs: sync
    if: ${{ always() && needs.sync.result == 'failure' && fromJSON(inputs.repair_attempt || '1') < 3 }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
    env:
      REPAIR_ATTEMPT: ${{ inputs.repair_attempt || '1' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      VERTEX_AI_LOCATION: us-central1
      VERTEX_AI_MODEL: gemini-2.5-flash
    steps:
      - name: Checkout pre for diagnosis
        uses: actions/checkout@v4
        with:
          ref: pre

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Authenticate to Google Cloud
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Collect failed step logs
        id: logs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run view "$GITHUB_RUN_ID" --log-failed > "$RUNNER_TEMP/sync-failure.log"

      - name: Ask Vertex to diagnose and repair the sync script
        id: vertex
        if: ${{ steps.auth.outcome == 'success' && steps.logs.outcome == 'success' }}
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FAILURE_LOG_PATH: ${{ runner.temp }}/sync-failure.log
        run: node scripts/repair-sync-content-failure.mjs

      - name: Commit and push a validated repair
        if: ${{ steps.vertex.outcome == 'success' }}
        run: |
          if git diff --quiet -- scripts/sync-content.mjs; then
            echo "Vertex no propuso cambios aplicables; se reintentará la ejecución sin modificar el código."
            exit 0
          fi
          node --check scripts/sync-content.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync-content.mjs
          git commit -m "fix: repair Sheets content sync"
          git push origin HEAD:pre

      - name: Retry the sync workflow
        if: ${{ always() && fromJSON(inputs.repair_attempt || '1') < 3 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          next_attempt=$((REPAIR_ATTEMPT + 1))
          gh workflow run sync-content.yml --ref pre -f repair_attempt="$next_attempt"
