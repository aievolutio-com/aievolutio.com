name: Auto PR pre -> main

on:
  push:
    branches: [pre]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  validate-and-open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production-sync guard
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require successful CI for the exact pre commit
        uses: actions/github-script@v9
        id: validation
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const {canSyncProduction, isNewerWorkflowRun} = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/production-sync.mjs`
            );
            const timeout = Date.now() + 20 * 60 * 1000;
            const dispatches = new Map();
            const missingSince = new Map();
            let validatedSha = '';

            while (Date.now() < timeout) {
              const pre = await github.rest.git.getRef({owner, repo, ref: 'heads/pre'});
              const currentPreSha = pre.data.object.sha;
              if (validatedSha && validatedSha !== currentPreSha) validatedSha = '';
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, head_sha: currentPreSha, per_page: 100,
              });
              const ciRuns = runs
                .filter(run => run.path?.startsWith('.github/workflows/ci.yml') && ['push', 'workflow_dispatch'].includes(run.event))
                .sort((left, right) => new Date(right.created_at) - new Date(left.created_at));
              const latestRun = ciRuns[0];
              const dispatchState = dispatches.get(currentPreSha);
              const isFreshRun =
                !dispatchState ||
                (latestRun &&
                  isNewerWorkflowRun({
                    runId: latestRun.id,
                    previousRunId: dispatchState.previousRunId,
                  }));

              if (
                latestRun?.status === 'completed' &&
                latestRun.conclusion === 'success' &&
                isFreshRun
              ) {
                validatedSha = latestRun.head_sha;
                if (canSyncProduction({
                  ciConclusion: latestRun.conclusion,
                  validatedSha,
                  currentPreSha,
                })) break;
              }
              if (
                latestRun?.status === 'completed' &&
                latestRun.conclusion !== 'success' &&
                isFreshRun
              ) {
                if (!dispatchState && context.eventName === 'workflow_dispatch') {
                  dispatches.set(currentPreSha, { previousRunId: latestRun.id });
                  await github.rest.actions.createWorkflowDispatch({
                    owner, repo, workflow_id: 'ci.yml', ref: 'pre',
                  });
                  core.info(`Se repite la validación solicitada para pre ${currentPreSha}; la ejecución anterior falló.`);
                } else {
                  core.setFailed(`CI ${latestRun.id} terminó ${latestRun.conclusion} para pre ${currentPreSha}; no se abrirá ni fusionará el PR de producción.`);
                  return;
                }
              }
              const hasActiveRun = latestRun && latestRun.status !== 'completed';
              const waitingForInitialRun = !latestRun && !missingSince.has(currentPreSha);
              if (waitingForInitialRun) missingSince.set(currentPreSha, Date.now());
              const hasMissingRunForLongEnough =
                !latestRun && Date.now() - missingSince.get(currentPreSha) >= 30_000;
              if (!hasActiveRun && !validatedSha && !dispatches.has(currentPreSha) && hasMissingRunForLongEnough) {
                dispatches.set(currentPreSha, { previousRunId: latestRun?.id || 0 });
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id: 'ci.yml', ref: 'pre',
                });
                core.info(`Se inició CI manual para el SHA de pre ${currentPreSha}.`);
              }
              await new Promise(resolve => setTimeout(resolve, 10_000));
            }
            if (!validatedSha) {
              core.setFailed('CI no validó el SHA actual de pre dentro de 20 minutos; no se abrirá ni fusionará el PR de producción.');
              return;
            }

            core.setOutput('validated-sha', validatedSha);
            core.info(`CI completó correctamente para ${validatedSha}; se permite sincronizar pre con main.`);

      - name: Ensure PR exists from pre to main
        id: ensure_pr
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const pre = await github.rest.git.getRef({owner, repo, ref: 'heads/pre'});
            if (pre.data.object.sha !== '${{ steps.validation.outputs.validated-sha }}') {
              core.setFailed('pre avanzó después de CI; se cancela el PR de producción para evitar sincronizar un SHA no validado.');
              return;
            }
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `main...${pre.data.object.sha}`,
            });
            if (comparison.data.ahead_by === 0) {
              core.info('main ya contiene el SHA validado de pre; no hay cambios que sincronizar.');
              return;
            }
            // Find existing open PR from pre to main
            const prs = await github.paginate(github.rest.pulls.list, {owner, repo, state: 'open', base: 'main', head: `${owner}:pre`});
            if (prs.length > 0) {
              core.setOutput('number', prs[0].number);
            } else {
              const title = 'ci: sync pre -> main';
              const body = `PR automático para integrar el SHA \`${pre.data.object.sha}\` de pre en main. Solo se abre tras CI satisfactorio para ese SHA. La sincronización conserva el historial mediante merge commits.`;
              const pr = await github.rest.pulls.create({owner, repo, base: 'main', head: 'pre', title, body, maintainer_can_modify: true});
              core.setOutput('number', pr.data.number);
            }

      - name: Enable auto-merge after CI validation
        if: ${{ steps.ensure_pr.outputs.number }}
        continue-on-error: true
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.ensure_pr.outputs.number }}
          merge-method: merge
