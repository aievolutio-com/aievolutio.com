name: Auto PR to pre (feature branches)

on:
  push:
    branches-ignore:
      - pre
      - main
      - gh-pages
      - dependabot/**
      - release-please**
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [ pre ]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  open-and-automerge:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create/ensure PR to pre and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list --repo "$REPO" --base pre --head "$BRANCH" --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --repo "$REPO" --base pre --head "$BRANCH" \
              --title "ci: auto-PR $BRANCH -> pre" \
              --body "Pull request automático desde $BRANCH hacia pre. Se activará auto-merge al pasar los checks."
            PR_NUMBER=$(gh pr list --repo "$REPO" --base pre --head "$BRANCH" --json number --jq '.[0].number')
          fi
          # Asegurar título compatible con Conventional Commits para pasar el check semántico
          gh pr edit --repo "$REPO" "$PR_NUMBER" --title "ci: auto-PR $BRANCH -> pre"
          CURRENT_HEAD_SHA=$(gh pr view --repo "$REPO" "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          if [ "$CURRENT_HEAD_SHA" != "$HEAD_SHA" ]; then
            echo "El SHA del PR cambió antes de validar; se cancela la integración." >&2
            exit 1
          fi

          gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
          VALIDATED=false
          for attempt in $(seq 1 120); do
            CI_RUN=$(gh run list --repo "$REPO" --workflow ci.yml --branch "$BRANCH" \
              --event workflow_dispatch --limit 50 \
              --json databaseId,headSha,status,conclusion,url \
              --jq "[.[] | select(.headSha == \"$HEAD_SHA\")] | sort_by(.databaseId) | last // empty")
            if [ -n "$CI_RUN" ]; then
              CI_STATUS=$(printf '%s' "$CI_RUN" | jq -r '.status')
              CI_CONCLUSION=$(printf '%s' "$CI_RUN" | jq -r '.conclusion // ""')
              if [ "$CI_STATUS" = "completed" ]; then
                if [ "$CI_CONCLUSION" != "success" ]; then
                  echo "CI no validó $HEAD_SHA (conclusión: $CI_CONCLUSION)." >&2
                  exit 1
                fi
                VALIDATED=true
                break
              fi
            fi
            sleep 10
          done
          if [ "$VALIDATED" != "true" ]; then
            echo "CI no validó el SHA $HEAD_SHA dentro de 20 minutos." >&2
            exit 1
          fi

          CURRENT_HEAD_SHA=$(gh pr view --repo "$REPO" "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          if [ "$CURRENT_HEAD_SHA" != "$HEAD_SHA" ]; then
            echo "El SHA del PR avanzó después de CI; se cancela la integración." >&2
            exit 1
          fi
          gh pr merge --repo "$REPO" --auto --squash "$PR_NUMBER"
          for attempt in $(seq 1 120); do
            PR_STATE=$(gh pr view --repo "$REPO" "$PR_NUMBER" --json state --jq '.state')
            if [ "$PR_STATE" = "MERGED" ]; then
              gh workflow run auto-pr-pre-to-main.yml --repo "$REPO" --ref pre
              gh workflow run github-housekeeping.yml --repo "$REPO" --ref pre
              exit $?
            fi
            if [ "$PR_STATE" = "CLOSED" ]; then
              echo "El PR $PR_NUMBER se cerró sin fusionarse; no se solicitará la promoción a main."
              exit 0
            fi
            sleep 10
          done
          echo "El PR $PR_NUMBER no se fusionó en 20 minutos; no se solicitará la promoción a main." >&2
          exit 1

  retitle-existing-pr:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure semantic PR title for feature -> pre
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const pr = context.payload.pull_request;
            if (!pr) { core.info('No PR in context'); return; }
            const ok = ['feat','fix','docs','chore','refactor','perf','test','ci','build','style'];
            const isSemantic = ok.some(p => pr.title.startsWith(p + ':'));
            if (isSemantic) { core.info('Title already semantic'); return; }
            const newTitle = `ci: auto-PR ${pr.head.ref} -> pre`;
            await github.rest.pulls.update({ owner, repo, pull_number: pr.number, title: newTitle });
            core.info(`Updated title to: ${newTitle}`);
