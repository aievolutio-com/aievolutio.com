name: Auto PR to pre (feature branches)

on:
  push:
    branches-ignore:
      - pre
      - main
      - gh-pages
      - dependabot/**
      - release-please**
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [ pre ]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  open-and-automerge:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create/ensure PR to pre and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          PR_NUMBER=$(gh pr list --repo "$REPO" --base pre --head "$BRANCH" --json number --jq '.[0].number')
          LIST_STATUS=$?
          if [ $LIST_STATUS -ne 0 ]; then
            echo "Aviso: gh pr list falló (posibles permisos insuficientes)." >&2
            echo "Acción sugerida: Settings > Actions > Workflow permissions: 'Read and write' + 'Allow GitHub Actions to create and approve pull requests'." >&2
            echo "Alternativa: usar un PAT como secret y exportarlo en GH_TOKEN." >&2
            exit 0
          fi
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --repo "$REPO" --base pre --head "$BRANCH" \
              --title "ci: auto-PR $BRANCH -> pre" \
              --body "Pull request automático desde $BRANCH hacia pre. Se activará auto-merge al pasar los checks."
            CREATE_STATUS=$?
            if [ $CREATE_STATUS -ne 0 ]; then
              echo "Aviso: No se pudo crear el PR (permisos). Verifica configuración indicada arriba." >&2
              exit 0
            fi
            PR_NUMBER=$(gh pr list --repo "$REPO" --base pre --head "$BRANCH" --json number --jq '.[0].number')
          fi
          # Asegurar título compatible con Conventional Commits para pasar el check semántico
          gh pr edit --repo "$REPO" "$PR_NUMBER" --title "ci: auto-PR $BRANCH -> pre" || true
          gh pr merge --repo "$REPO" --auto --squash "$PR_NUMBER" || true
          for attempt in $(seq 1 120); do
            PR_STATE=$(gh pr view --repo "$REPO" "$PR_NUMBER" --json state --jq '.state')
            STATE_STATUS=$?
            if [ $STATE_STATUS -ne 0 ]; then
              echo "No se pudo consultar el estado del PR $PR_NUMBER; no se solicitará la promoción a main." >&2
              exit 1
            fi
            if [ "$PR_STATE" = "MERGED" ]; then
              gh workflow run auto-pr-pre-to-main.yml --repo "$REPO" --ref pre
              exit $?
            fi
            if [ "$PR_STATE" = "CLOSED" ]; then
              echo "El PR $PR_NUMBER se cerró sin fusionarse; no se solicitará la promoción a main."
              exit 0
            fi
            sleep 10
          done
          echo "El PR $PR_NUMBER no se fusionó en 20 minutos; no se solicitará la promoción a main." >&2
          exit 1

  retitle-existing-pr:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure semantic PR title for feature -> pre
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const pr = context.payload.pull_request;
            if (!pr) { core.info('No PR in context'); return; }
            const ok = ['feat','fix','docs','chore','refactor','perf','test','ci','build','style'];
            const isSemantic = ok.some(p => pr.title.startsWith(p + ':'));
            if (isSemantic) { core.info('Title already semantic'); return; }
            const newTitle = `ci: auto-PR ${pr.head.ref} -> pre`;
            await github.rest.pulls.update({ owner, repo, pull_number: pr.number, title: newTitle });
            core.info(`Updated title to: ${newTitle}`);
