name: GitHub housekeeping

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1'
  push:
    branches: [pre]
  pull_request:
    types: [closed]
    branches: [pre]

permissions: {}

concurrency:
  group: github-housekeeping
  cancel-in-progress: false

jobs:
  audit-and-clean:
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (github.event.pull_request.merged == true)
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: pre
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Audit repository and safely clean integrated branches
        uses: actions/github-script@v9
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { decideBranchCleanup, getCommitAgeDays, summarizeTagRefs } = await import(
              pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'scripts/github-housekeeping.mjs')).href
            );
            const { owner, repo } = context.repo;
            const safeCell = value => String(value).replace(/[\r\n|]/g, ' ').replace(/`/g, '\\`');
            const [repository, branches, openPullRequests, openIssues, activeRuns, tags, releases] = await Promise.all([
              github.rest.repos.get({ owner, repo }),
              github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 }),
              github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 }),
              github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 }),
              Promise.all(['queued', 'in_progress'].map(status =>
                github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                  owner, repo, status, per_page: 100,
                }),
              )),
              github.paginate(github.rest.repos.listMatchingRefs, { owner, repo, ref: 'tags/', per_page: 100 }),
              github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 }),
            ]);
            const branchCommits = new Map(await Promise.all(branches.map(async branch => {
              const { data: commit } = await github.rest.repos.getCommit({
                owner, repo, ref: branch.commit.sha,
              });
              return [branch.name, commit];
            })));
            const tagSummary = summarizeTagRefs(tags);
            const activeBranchRuns = activeRuns.flat().filter(run => run.head_branch);
            const branchResults = [];
            const now = Date.now();

            for (const branch of branches) {
              const ageDays = getCommitAgeDays(branchCommits.get(branch.name), now);
              const hasOpenPullRequest = openPullRequests.some(pr => pr.head.ref === branch.name);
              const hasActiveWorkflow = activeBranchRuns.some(run => run.head_branch === branch.name);
              let mergedIntoPre = false;

              if (!['main', 'pre', 'gh-pages', repository.data.default_branch].includes(branch.name) &&
                  ageDays >= 7 && !hasOpenPullRequest && !hasActiveWorkflow) {
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner, repo, basehead: `pre...${branch.name}`,
                });
                mergedIntoPre = comparison.data.ahead_by === 0;
              }

              const decision = decideBranchCleanup({
                branchName: branch.name,
                defaultBranch: repository.data.default_branch,
                ageDays,
                hasOpenPullRequest,
                hasActiveWorkflow,
                mergedIntoPre,
                isProtected: branch.protected,
              });
              if (decision.action === 'delete') {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch.name}` });
              }
              branchResults.push({
                name: branch.name,
                ageDays: ageDays ?? 'unknown',
                sha: branch.commit.sha,
                protected: branch.protected,
                ...decision,
              });
            }

            const userIssues = openIssues.filter(issue => !issue.pull_request);
            const updated = new Date().toISOString();
            const lines = [
              '# GitHub housekeeping report',
              '',
              `- Generated: ${updated}`,
              `- Default branch: \`${repository.data.default_branch}\``,
              `- Delete merged branches automatically: ${repository.data.delete_branch_on_merge ? 'enabled' : 'disabled'}`,
              `- \`pre\`: \`${branches.find(branch => branch.name === 'pre')?.commit.sha || 'missing'}\``,
              `- \`main\`: \`${branches.find(branch => branch.name === 'main')?.commit.sha || 'missing'}\``,
              `- \`gh-pages\`: \`${branches.find(branch => branch.name === 'gh-pages')?.commit.sha || 'missing'}\``,
              `- Semantic tags: ${tagSummary.names.length ? tagSummary.names.map(name => `\`${safeCell(name)}\``).join(', ') : 'none yet'}`,
              ...(tagSummary.malformedCount
                ? [`- Tag refs omitted because the API response lacked a valid tag ref: ${tagSummary.malformedCount}.`]
                : []),
              `- GitHub releases: ${releases.length}`,
              '',
              '## Branches',
              '',
              '| Branch | Age (days) | Protected | Decision | Reason |',
              '|---|---:|:---:|---|---|',
              ...branchResults.map(item =>
                `| \`${safeCell(item.name)}\` | ${item.ageDays} | ${item.protected ? 'yes' : 'no'} | ${item.action === 'delete' ? 'deleted' : item.action} | ${item.reason} |`,
              ),
              '',
              '## Open pull requests',
              '',
              ...(openPullRequests.length
                ? openPullRequests.map(pr => `- [#${pr.number} ${safeCell(pr.title)}](${pr.html_url}) — \`${safeCell(pr.head.ref)}\` → \`${safeCell(pr.base.ref)}\`; updated ${pr.updated_at}.`)
                : ['- None.']),
              '',
              '## Open issues requiring triage',
              '',
              ...(userIssues.length
                ? userIssues.map(issue => `- [#${issue.number} ${safeCell(issue.title)}](${issue.html_url}) — updated ${issue.updated_at}.`)
                : ['- None.']),
              '',
              'Issues are never closed by this workflow. Unmerged branches 30 days old or older are flagged for human review, not deleted.',
            ];
            const report = `${lines.join('\n')}\n`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report);
            fs.writeFileSync('housekeeping-report.md', report, 'utf8');
      - name: Preserve report
        uses: actions/upload-artifact@v4
        with:
          name: github-housekeeping-${{ github.run_id }}
          path: housekeeping-report.md
          retention-days: 90
