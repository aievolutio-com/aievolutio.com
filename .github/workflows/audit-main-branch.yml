name: Audit main branch updates

on:
  push:
    branches: [main]

jobs:
  check-merge-source:
    runs-on: ubuntu-latest
    steps:
      - name: Report direct pushes to main
        if: ${{ !startsWith(github.event.head_commit.message, 'Merge pull request') }}
        run: |
          echo "Main updates should be merged through a pull request. Configure branch protection to prevent direct pushes." 1>&2
          exit 1
